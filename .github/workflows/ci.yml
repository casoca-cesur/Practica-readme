on: 
  push:
    branches: 
      - develop
  pull_request:
      branches:
        - develop
  workflow_dispatch:
  
jobs: 
  upload-readme:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Clone repo
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: git clone https://x-access-token:${GH_TOKEN}@github.com/casoca-cesur/Practica-Github-Avanzado.git
              
            - name: Add new line to README.md
              run: 'cd Practica-Github-Avanzado && echo "Añadida feature: $GITHUB_REF_NAME" >> README.md'

            - name: Upload changes
              run: |
                cd Practica-Github-Avanzado
                git config --global user.name "casoca-cesur"
                git config --global user.email "carmen.s607893@cesurformacion.com"
                git add README.md
                git commit -m "Cambio en README.md"
                git push


  second:
    runs-on: self-hosted
    needs: upload-readme
    steps:
      - name: Validar secret
        env:
          GH_DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
          shell: powershell
        run: | 
            if ($env:GH_SECRET_DEV -eq $env:LOCAL_DEV_TOKEN) {
            Write-Output "Los tokens coinciden"
            } else {
            Write-Output "Los tokens no coinciden."
            exit 1
            }
